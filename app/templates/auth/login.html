{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="glass max-w-md w-full rounded-2xl p-8 card-shadow">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-4">
                <i data-lucide="landmark" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Banco Moderno</h1>
            <p class="text-gray-500">Acesse sua conta</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition-colors flex items-center justify-center gap-2">
                <span>Entrar</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">Não tem uma conta? <a href="/register" class="text-blue-600 font-bold">Cadastre-se</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('login-form').onsubmit = async (e) => {
        e.preventDefault();
        const formData = new URLSearchParams();
        formData.append('username', document.getElementById('email').value);
        formData.append('password', document.getElementById('password').value);

        try {
            const response = await fetch('/api/v1/login/access-token', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (response.ok) {
                API.setToken(data.access_token);
                window.location.href = '/dashboard';
            } else {
                API.showToast(data.detail || 'E-mail ou senha incorretos');
            }
        } catch (err) {
            API.showToast('Erro de conexão com o servidor');
        }
    };
</script>
{% endblock %}
