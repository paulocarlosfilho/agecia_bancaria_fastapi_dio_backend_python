{% extends "base.html" %}

{% block title %}Cadastro{% endblock %}

{% block content %}
<div class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="glass max-w-md w-full rounded-2xl p-8 card-shadow">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Criar Conta</h1>
            <p class="text-gray-500">Comece sua jornada financeira</p>
        </div>

        <form id="register-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                <input type="text" id="full_name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition-colors">
                Criar Conta
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">Já tem uma conta? <a href="/login" class="text-blue-600 font-bold">Entrar</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('register-form').onsubmit = async (e) => {
        e.preventDefault();
        
        try {
            await API.request('/users/', {
                method: 'POST',
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    full_name: document.getElementById('full_name').value,
                    password: document.getElementById('password').value
                })
            });
            
            API.showToast('Conta criada com sucesso! Redirecionando...', 'success');
            setTimeout(() => window.location.href = '/login', 2000);
        } catch (err) {
            API.showToast(err.message);
        }
    };
</script>
{% endblock %}
