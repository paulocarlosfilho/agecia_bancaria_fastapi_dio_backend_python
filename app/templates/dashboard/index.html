{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block head %}
<style>
    .account-card:hover .delete-btn { opacity: 1; }
</style>
{% endblock %}

{% block content %}
<!-- Navbar -->
<nav class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <div class="flex items-center gap-2">
                <i data-lucide="landmark" class="w-8 h-8 text-blue-600"></i>
                <span class="text-xl font-bold text-gray-900">Banco Moderno</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right hidden sm:block">
                    <p id="user-name" class="text-sm font-semibold text-gray-900">Carregando...</p>
                    <p id="user-email" class="text-xs text-gray-500">...</p>
                </div>
                <button onclick="API.logout()" class="p-2 text-gray-400 hover:text-red-500 transition-colors">
                    <i data-lucide="log-out" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Accounts -->
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-white rounded-2xl p-6 card-shadow border border-gray-100">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-gray-900">Minhas Contas</h2>
                    <button onclick="Dashboard.showCreateModal()" class="p-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-colors">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                </div>

                <div id="accounts-list" class="space-y-4">
                    <!-- Accounts render here -->
                </div>
                
                <!-- Create Account Modal (Inline) -->
                <div id="create-account-modal" class="hidden mt-4 p-4 border-2 border-dashed border-blue-100 rounded-xl bg-blue-50/50">
                    <p class="text-sm font-bold text-blue-800 mb-3 text-center">Tipo de Conta</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="Dashboard.createAccount('checking')" class="p-2 bg-white border border-blue-200 rounded-lg text-xs font-semibold hover:bg-blue-600 hover:text-white transition-all">Corrente</button>
                        <button onclick="Dashboard.createAccount('savings')" class="p-2 bg-white border border-blue-200 rounded-lg text-xs font-semibold hover:bg-blue-600 hover:text-white transition-all">Poupança</button>
                    </div>
                    <button onclick="Dashboard.hideCreateModal()" class="w-full text-[10px] text-gray-400 mt-3 uppercase tracking-widest">Cancelar</button>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="bg-white rounded-2xl p-6 card-shadow border border-gray-100">
                <h2 class="text-lg font-bold text-gray-900 mb-4">Ações Rápidas</h2>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="Dashboard.openModal('deposit')" class="p-4 rounded-xl border border-gray-100 hover:border-blue-200 hover:bg-blue-50 transition-all flex flex-col items-center gap-2">
                        <div class="w-10 h-10 bg-green-50 text-green-600 rounded-full flex items-center justify-center">
                            <i data-lucide="arrow-down-circle" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-medium text-gray-600">Depósito</span>
                    </button>
                    <button onclick="Dashboard.openModal('withdraw')" class="p-4 rounded-xl border border-gray-100 hover:border-blue-200 hover:bg-blue-50 transition-all flex flex-col items-center gap-2">
                        <div class="w-10 h-10 bg-red-50 text-red-600 rounded-full flex items-center justify-center">
                            <i data-lucide="arrow-up-circle" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-medium text-gray-600">Saque</span>
                    </button>
                    <button onclick="Dashboard.openModal('transfer')" class="p-4 rounded-xl border border-gray-100 hover:border-blue-200 hover:bg-blue-50 transition-all flex flex-col items-center gap-2">
                        <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center">
                            <i data-lucide="repeat" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-medium text-gray-600">Transferir</span>
                    </button>
                    <button onclick="Dashboard.refresh()" class="p-4 rounded-xl border border-gray-100 hover:border-blue-200 hover:bg-blue-50 transition-all flex flex-col items-center gap-2">
                        <div class="w-10 h-10 bg-purple-50 text-purple-600 rounded-full flex items-center justify-center">
                            <i data-lucide="refresh-cw" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-medium text-gray-600">Atualizar</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Column: Transactions -->
        <div class="lg:col-span-8">
            <div class="bg-white rounded-2xl p-6 card-shadow border border-gray-100 h-full">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-gray-900">Histórico de Transações</h2>
                    <div class="flex items-center gap-2">
                        <button onclick="Dashboard.changePage(-1)" class="p-2 rounded-lg hover:bg-gray-100"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                        <span id="current-page" class="text-sm font-bold w-6 text-center">1</span>
                        <button onclick="Dashboard.changePage(1)" class="p-2 rounded-lg hover:bg-gray-100"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                    </div>
                </div>

                <div id="transactions-list" class="space-y-1">
                    <!-- Transactions render here -->
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Action Modal -->
<div id="action-modal" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-8 card-shadow">
        <h3 id="modal-title" class="text-xl font-bold mb-6">Título</h3>
        <form id="action-form" class="space-y-4">
            <input type="hidden" id="action-type">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Conta de Origem</label>
                <select id="modal-account-id" required class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"></select>
            </div>
            <div id="target-account-field" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Conta de Destino (Número)</label>
                <input type="text" id="modal-target-number" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ex: CC-0001-01">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Valor (R$)</label>
                <input type="number" step="0.01" id="modal-amount" required class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
                <input type="text" id="modal-description" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex gap-3 pt-4">
                <button type="button" onclick="Dashboard.closeModal()" class="flex-1 px-4 py-2 border rounded-lg font-semibold hover:bg-gray-50 transition-colors">Cancelar</button>
                <button type="submit" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition-colors">Confirmar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/dashboard.js"></script>
{% endblock %}
